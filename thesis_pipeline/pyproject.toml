[project]
name = "thesis-pipeline"
version = "0.1.0"
description = "Shared code for the DigiDiaDem V2 LLM-feature extraction thesis pipeline"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "openai",
    "python-dotenv",
    "joblib",
    "llm-feature-gen",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["thesis_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
